<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roast Toast Coast Cafe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #menu-list {
            display: none;
            margin-top: 15px;
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 5px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <h1>Welcome to the Roast Toast Coast Cafe!</h1>
    <p>Where flavor meets the shore!</p>

    <!-- FIX 1: Uses standard 'src' tag so image renders -->
    <img src="logo.png" alt="Roast Toast Coast Cafe Logo" width="300" onerror="this.src='https://placehold.co'">

    <br><br>
    <!-- The interactive button -->
    <button id="menu-btn" style="padding: 10px 20px; cursor: pointer;">Our Menu</button>

    <!-- The menu container -->
    <ul id="menu-list">
        <li>☕ Breezy Brews</li>
        <li>🍞 Toasty Delights</li>
        <li>🥪 Coastal Bites</li>
        <li>🍹 Sunset Sips</li>
    </ul>

    <script>
        // FIX 2: Correctly matches ID and adds click interaction
        const menuBtn = document.getElementById("menu-btn");
        const menuList = document.getElementById("menu-list");

        menuBtn.addEventListener("click", function() {
            if (menuList.style.display === "none" || menuList.style.display === "") {
                menuList.style.display = "block";
            } else {
                menuList.style.display = "none";
            }
        });
    </script>

</body>
</html>
